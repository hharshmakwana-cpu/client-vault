<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Client Vault">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Client Vault</title>
<style>
:root{color-scheme:light dark;
  --bg:#f2f2f7;--card:#fff;--text:#0b0b0f;--sub:#6e6e73;--ter:#aeaeb2;--sep:rgba(60,60,67,.18);
  --accent:#0a66d8;--accent2:#3a8cff;--accent-soft:rgba(10,102,216,.1);--danger:#e5352b;--warn:#b25000;--ok:#248a3d;
  --fill:rgba(118,118,128,.12);--fill2:rgba(120,120,128,.2);--banner:#fff4e5;--banner-t:#8a4b00;--info:#e8f1fd;--info-t:#0a4fa8;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);--press:rgba(118,118,128,.14);
  --ease:cubic-bezier(.32,.72,0,1);--r:18px;
  /* iOS 26+ draws its own "Liquid Glass" blur that fades out ~40pt below the status bar, and no CSS
     turns it off. In the installed app we add a small gap so the button text sits below the fade. */
  --top:env(safe-area-inset-top)}
@media (display-mode:standalone){:root{--top:calc(env(safe-area-inset-top) + 24px)}}
@media (display-mode:standalone) and (orientation:landscape) and (max-height:500px){:root{--top:env(safe-area-inset-top)}}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--ter:#636366;--sep:rgba(84,84,88,.5);--accent:#409cff;--accent2:#6bb3ff;--accent-soft:rgba(64,156,255,.16);--danger:#ff6961;--warn:#ffb340;--ok:#30d158;--fill:rgba(118,118,128,.24);--fill2:rgba(120,120,128,.36);--banner:#2c1f0a;--banner-t:#ffb340;--info:#0d2140;--info-t:#8cc1ff;--shadow:none;--press:rgba(255,255,255,.08)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
/* feel like an app: no pinch / double-tap zoom, and long-pressing buttons doesn't select text */
button,.bar,.tabs,.chip,.tile,.seg,.lock-icon,.avatar,.group-h,.foot{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;letter-spacing:-.01em}
#app{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:calc(32px + env(safe-area-inset-bottom));position:relative;z-index:1;background:var(--bg)}
body.cover #app{visibility:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- screen transitions: the old screen is copied into a layer that moves away ---- */
.layer{position:fixed;inset:0;overflow:hidden;background:var(--bg);pointer-events:none}
.layer.under{z-index:0}
.layer.over{z-index:2;box-shadow:-12px 0 32px rgba(0,0,0,.16)}
.layer.over.sheet{box-shadow:0 -12px 32px rgba(0,0,0,.16)}
.layer-in{max-width:680px;margin:0 auto;min-height:100%}
.layer .dim{position:fixed;inset:0;background:#000;opacity:0}
body.anim-push #app,body.swiping #app{box-shadow:-12px 0 32px rgba(0,0,0,.16)}
body.anim-present #app{box-shadow:0 -12px 32px rgba(0,0,0,.16)}
body.animating{pointer-events:none}

/* ---- nav bar ---- */
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:var(--top);border-bottom:.5px solid transparent;margin-bottom:12px;transition:border-color .25s}
.bar.edge{border-bottom-color:var(--sep)}
.bar-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;padding:0 8px}
.bar-t{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;transition:opacity .2s,transform .25s var(--ease)}
.bar.has-big .bar-t{opacity:0;transform:translateY(4px)}
.bar.has-big.collapsed .bar-t{opacity:1;transform:none}
.bar-r{justify-self:end}
.nav-btn{color:var(--accent);display:inline-flex;align-items:center;gap:5px;padding:8px;min-height:44px;transition:opacity .15s}
.nav-btn:active{opacity:.45}
.nav-btn.strong{font-weight:600}
.nav-btn:disabled{opacity:.4}
.nav-btn.back{padding-left:4px}
h1.large{font-size:34px;font-weight:700;margin:-2px 20px 12px;letter-spacing:-.025em}

/* ---- search + filter chips ---- */
.search{margin:0 16px 12px;position:relative;color:var(--sub)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
.search input{width:100%;border:0;border-radius:999px;background:var(--fill);padding:10px 14px 10px 38px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none;transition:background .2s,box-shadow .2s}
.search input:focus{background:var(--card);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--sep);font-size:15px;color:var(--text);white-space:nowrap;transition:background .25s,color .25s,transform .18s var(--ease)}
.chip:active{transform:scale(.95)}
.chip b{font-weight:500;color:var(--sub);margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--text);color:var(--bg);box-shadow:none}
.chip.on b{color:inherit;opacity:.6}

/* ---- grouped lists ---- */
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin:0 34px 8px}
.group-h a,.group-h .linkbtn{text-transform:none;font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;gap:4px;align-items:center;letter-spacing:0;color:var(--accent)}
.group-h .linkbtn.danger{color:var(--danger)}
.group{background:var(--card);border-radius:var(--r);margin:0 16px 28px;overflow:hidden;box-shadow:var(--shadow)}
.group>*{position:relative}
.group>*+*::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:.5px solid var(--sep)}
.group>.lrow+.lrow::before{left:72px}
.foot{font-size:13px;color:var(--sub);margin:-20px 34px 28px;line-height:1.45}
.center{text-align:center}

.row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:12px 18px;text-align:left;transition:background-color .35s}
button.row:active{background:var(--press);transition:none}
.row.link{color:var(--accent)}
.row.danger{color:var(--danger);justify-content:center;font-weight:500}
.grow{flex:1;min-width:0}
.grow small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.val{color:var(--sub);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lrow{padding-top:10px;padding-bottom:10px}
.avatar{--h:210;width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;letter-spacing:.02em;background:linear-gradient(160deg,hsl(var(--h) 70% 68%),hsl(calc(var(--h) + 20) 55% 44%));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 3px rgba(0,0,0,.12)}
.avatar.big{width:92px;height:92px;font-size:34px;margin:0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px hsl(var(--h) 60% 50% / .28)}
.lt{flex:1;min-width:0}
.lt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt small{display:block;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-variant-numeric:tabular-nums}
.badge{flex:none;font-size:12px;font-weight:500;color:var(--sub);background:var(--fill);border-radius:999px;padding:3px 9px}
.chev{color:var(--ter);flex:none;display:flex}

/* ---- client detail ---- */
.hero{text-align:center;padding:6px 16px 20px}
.hero h2{font-size:28px;font-weight:700;margin:14px 0 4px;word-break:break-word;letter-spacing:-.025em}
.hero p{margin:0;color:var(--sub);font-size:15px}
.qa{display:flex;gap:10px;margin:0 16px 28px}
.qa a{flex:1;background:var(--card);border-radius:16px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--accent);font-size:12px;font-weight:500;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s var(--ease),background .3s}
.qa a:active{transform:scale(.95);background:var(--press)}
.qa a[aria-disabled]{opacity:.35;pointer-events:none}
.dcol{flex:1;min-width:0}
.dlabel{font-size:13px;color:var(--sub);margin-bottom:3px}
.dval{word-break:break-word;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.dval a{text-decoration:none}
.dval.muted{color:var(--sub)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--accent);flex:none;transition:background .3s,transform .18s var(--ease),color .2s}
.ibtn:active{background:var(--press);transform:scale(.9);transition:none}
.ibtn.done{color:var(--ok)}
.meta{text-align:center;font-size:13px;color:var(--sub);margin:-8px 16px 24px}

/* ---- edit form ---- */
.frow{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;min-height:48px;padding:0 8px 0 18px}
.flabel{width:104px;flex:none;font-size:15px;line-height:1.2;padding:4px 0;color:var(--text)}
.frow.bad .flabel{color:var(--danger)}
.finput{flex:1;min-width:0;border:0;background:none;outline:none;padding:13px 0;font-size:17px;-webkit-appearance:none;appearance:none;border-radius:0}
.finput::placeholder{color:var(--ter)}
.finput.up{text-transform:uppercase}
.finput.up::placeholder{text-transform:none}
textarea.finput{min-height:76px;resize:vertical;line-height:1.35;padding-right:8px}
select.finput{color:var(--accent);background:none}
.fmsg{width:100%;font-size:13px;line-height:1.3;padding:0 8px 10px 116px;margin-top:-6px;text-align:left;animation:msg .25s var(--ease)}
@keyframes msg{from{opacity:0;transform:translateY(-3px)}}
.fmsg.err{color:var(--danger)}
.fmsg.warn{color:var(--warn)}
.fmsg.ok{color:var(--ok)}
.frow.bare .fmsg{padding-left:0}
.masked{-webkit-text-security:disc}
.xrow{display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;min-height:48px}
.xrow .xl{flex:0 0 34%;border-right:.5px solid var(--sep);padding-right:8px}
.rm{width:22px;height:22px;border-radius:50%;background:var(--danger);flex:none;position:relative}
.rm::after{content:"";position:absolute;left:5px;right:5px;top:10px;height:2px;background:#fff;border-radius:1px}
.addrow{color:var(--accent);gap:10px;font-weight:500}
.addrow .plus{width:22px;height:22px;border-radius:50%;background:#34c759;color:#fff;display:grid;place-items:center;font-weight:700;line-height:1}
.tag{font-size:12px;font-weight:500;color:var(--sub);background:var(--fill);border-radius:999px;padding:3px 9px;flex:none}
.plain{border:0;background:none;color:var(--sub);font-size:17px;outline:none;-webkit-appearance:none;appearance:none;text-align:right;max-width:55%}
.toggle{color:var(--sub);font-size:15px;padding:6px 12px;border-radius:999px;background:var(--fill);flex:none;transition:background .2s,color .2s}
.toggle.on{color:#fff;background:var(--accent)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .3s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .35s var(--ease)}
.switch[aria-checked="true"]{background:#34c759}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:disabled{opacity:.4}

/* ---- lock screens ---- */
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--top)) 24px calc(24px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(120% 55% at 50% -5%,var(--accent-soft),transparent 70%)}
.lock>*{animation:rise .6s var(--ease) both}
.lock>*:nth-child(2){animation-delay:.05s}.lock>*:nth-child(3){animation-delay:.1s}.lock>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.lock-icon{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#4f9bff 0%,#1d6fe8 45%,#0a46be 100%);margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 34px rgba(10,70,190,.32)}
.lock h1{font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.025em}
.lock .sub{color:var(--sub);margin:0 0 28px;max-width:340px;font-size:15px;line-height:1.45}
.stack{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:left}
.field{width:100%;border:0;border-radius:14px;background:var(--card);padding:15px 16px;font-size:17px;outline:none;box-shadow:inset 0 0 0 .5px var(--sep),var(--shadow);transition:box-shadow .2s}
.field:focus{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px var(--accent-soft)}
.btn{width:100%;border-radius:14px;padding:15px;font-weight:600;font-size:17px;text-align:center;transition:transform .18s var(--ease),opacity .2s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px rgba(10,102,216,.25)}
.btn.primary:active{filter:brightness(.95)}
.btn.plainbtn{color:var(--accent);font-weight:500;padding:10px;box-shadow:none}
.btn:disabled{opacity:.5}
.facebtn{display:flex;flex-direction:column;align-items:center;gap:14px;margin:0 auto 8px;color:var(--accent);font-size:17px;font-weight:600;padding:8px 16px}
.facebtn .ring{width:100px;height:100px;border-radius:30px;display:grid;place-items:center;background:var(--card);box-shadow:inset 0 0 0 .5px var(--sep),0 10px 30px rgba(10,102,216,.14);transition:transform .2s var(--ease)}
.facebtn:active .ring{transform:scale(.94)}
.hint{font-size:13px;color:var(--sub);line-height:1.45;margin:4px 2px 0}
.err{color:var(--danger);font-size:14px;min-height:1.2em;margin:2px 2px 0;text-align:center}
.pad{padding:0 16px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--accent);animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:0 16px 16px;padding:13px 16px;border-radius:16px;background:var(--banner);color:var(--banner-t);font-size:15px;text-align:left;line-height:1.35;animation:rise .45s var(--ease) both}
.banner.info{background:var(--info);color:var(--info-t)}
.banner .bbtn{flex:none;font-weight:600;color:inherit;padding:4px 2px}
.banner .bx{flex:none;font-size:20px;line-height:1;opacity:.6;padding:2px 4px}
.empty{text-align:center;color:var(--sub);padding:56px 32px}
.empty b{display:block;color:var(--text);font-size:20px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.96);background:rgba(28,28,30,.86);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#fff;padding:11px 20px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .45s var(--ease);z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media (display-mode:standalone){#toast{bottom:calc(64px + env(safe-area-inset-bottom))}}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---- practice: tiles, segmented control, due chips, ledger ---- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 16px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border-radius:16px;padding:13px 13px 11px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0;transition:transform .18s var(--ease)}
button.tile:active{transform:scale(.96)}
.tile b{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:12px;color:var(--sub);font-weight:500}
.tile.red b{color:var(--danger)}.tile.amber b{color:var(--warn)}.tile.blue b{color:var(--accent)}.tile.green b{color:var(--ok)}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;margin:0 16px 18px;gap:2px}
.seg button{flex:1;min-width:0;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .25s,box-shadow .25s}
.seg button b{font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.duechip{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.duechip.late{background:rgba(229,53,43,.12);color:var(--danger)}
.duechip.soon{background:rgba(255,149,0,.16);color:var(--warn)}
.duechip.okc{background:rgba(52,199,89,.16);color:var(--ok)}
.duechip.big{display:inline-block;margin-top:12px;font-size:13px;padding:6px 14px}
.trow{padding-top:10px;padding-bottom:10px}
/* in due lists the return + period line matters most, so let it use two lines */
.lrow[data-act="task"] .lt small,.lrow[data-act="pwtask"] .lt small,.lrow .lt small.wrap2,.trow .lt small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ter)}
.sdot.s-docs{background:var(--accent)}.sdot.s-filed,.sdot.s-done{background:#34c759}
.task-hero{padding-top:2px}
.task-hero h2{font-size:24px}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0}
.dnote{font-size:12px;color:var(--sub);margin-top:4px}
.muted{color:var(--sub)}
.amt{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.amt.due{color:var(--danger)}.amt.in{color:var(--ok)}
.linkbtn{color:var(--accent);font-weight:500}
.stat .grow{display:block}
.bar-track{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}
.bar-fill{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px}
.tname{display:block;font-weight:600;margin-bottom:3px}
.preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--sub);line-height:1.35;white-space:normal}
button.row:disabled{opacity:.45}
.sendbtn,.copybtn{flex:none;font-size:14px;font-weight:600;color:#fff;background:var(--accent);padding:7px 16px;border-radius:999px;transition:transform .18s var(--ease),background .25s}
.sendbtn:active,.copybtn:active{transform:scale(.94)}
.sendbtn.sent,.copybtn.done{background:#34c759}
.errtext{color:var(--danger)!important}.warntext{color:var(--warn)!important}
a.btn{display:block;text-decoration:none}

/* ---- invoice / receipt preview: always looks like paper, also in dark mode ---- */
.paper{background:#fff;color:#16161a;margin:0 16px 20px;padding:22px 20px 18px;border-radius:14px;font-size:12px;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px rgba(15,23,42,.1);-webkit-user-select:text;user-select:text;letter-spacing:0}
.paper small{display:block;color:#6b6b72;font-size:11px}
.paper .pp-l{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b6b72;margin-bottom:3px}
.pp-head{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1.5px solid #0a66d8;margin-bottom:14px}
.pp-from{min-width:0}
.pp-firm{display:block;font-size:15px;word-break:break-word}
.pp-r{text-align:right;flex:none}
.pp-title{display:block;color:#0a66d8;font-size:15px;letter-spacing:.02em}
.pp-to{margin-bottom:14px}
.pp-to b{display:block;font-size:13px}
.pp-t{width:100%;border-collapse:collapse;margin-bottom:10px;font-variant-numeric:tabular-nums}
.pp-t th{background:#f2f4f8;color:#6b6b72;font-size:10px;font-weight:700;text-align:left;padding:7px 8px}
.pp-t th:last-child,.pp-t td:last-child{text-align:right;white-space:nowrap}
.pp-t tbody td{padding:9px 8px;border-bottom:1px solid #e6e6ea;vertical-align:top}
.pp-t tfoot td{padding:4px 8px;color:#6b6b72}
.pp-t tfoot td:first-child{text-align:right}
.pp-t tfoot tr.strong td{color:#16161a;font-weight:700;font-size:13px;border-top:1px solid #16161a;padding-top:7px}
.pp-words{font-weight:600;margin:0 0 12px}
.pp-x{margin-bottom:10px}
.pp-sign{text-align:right;font-weight:600;margin-top:22px}
.pp-sign span{display:block;font-weight:400;color:#6b6b72;margin-top:26px;font-size:11px}

/* ---- first-run help: welcome, checklist, empty screens ---- */
.welcome{padding-top:0}
.welcome .lock-icon{margin:0 auto 4px;width:72px;height:72px;border-radius:20px}
.welcome .lock-icon svg{width:36px;height:36px}
.welcome p{max-width:340px;margin:0 auto;line-height:1.45}
.guide{background:var(--card);border-radius:var(--r);margin:0 16px 22px;overflow:hidden;box-shadow:var(--shadow);animation:rise .45s var(--ease) both}
.guide-h{display:flex;align-items:center;gap:10px;padding:14px 12px 8px 18px}
.guide-h b{font-size:17px;flex:1}
.guide-h span{font-size:13px;color:var(--sub)}
.guide-h .bx{font-size:22px;line-height:1;color:var(--sub);padding:2px 6px}
.guide-bar{height:4px;margin:0 18px 6px;border-radius:2px;background:var(--fill);overflow:hidden}
.guide-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s var(--ease)}
.guide .row{border-top:.5px solid var(--sep)}
.guide .row.next .grow{font-weight:600}
.guide .row .grow small{font-weight:400}
.guide .row:disabled{opacity:1}
.guide .row:disabled .grow{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--ter)}
.gcheck{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--ter);color:#fff}
.gcheck.on{background:#34c759;box-shadow:none}
.gcheck svg{width:15px;height:15px}
.empty-actions{margin:20px auto 0;max-width:300px;text-align:center}
.linkbtn.small{font-size:14px;padding:6px}
.chev.open svg{transform:rotate(90deg)}
.chev svg{transition:transform .25s var(--ease)}

/* ---- firm logo ---- */
.logo-box{width:56px;height:40px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--ter);font-size:11px;font-weight:500;overflow:hidden}
.logo-box.has{background:#fff;box-shadow:inset 0 0 0 .5px var(--sep)}
.logo-thumb{max-width:52px;max-height:36px;object-fit:contain;display:block}
.logo-row .linkbtn{padding:6px 2px;flex:none}
.pp-head .pp-logo{max-width:96px;max-height:44px;object-fit:contain;flex:none;align-self:flex-start;margin-right:2px}
.pp-head{align-items:flex-start}
.pp-from{flex:1}
.lock-icon.brand-logo{background:#fff;box-shadow:0 0 0 .5px var(--sep),0 14px 34px rgba(15,23,42,.14);overflow:hidden;padding:10px;width:auto;min-width:88px;max-width:200px}
.lock-icon.brand-logo img{max-width:180px;max-height:68px;object-fit:contain;display:block}
.mini-brand{display:inline-flex;align-items:center;gap:8px;max-width:46vw;padding:6px 8px;min-height:44px;color:var(--sub);font-size:13px;font-weight:600;text-align:left}
.mini-brand img{height:28px;max-width:64px;object-fit:contain;border-radius:6px;background:#fff;padding:2px;box-shadow:0 0 0 .5px var(--sep)}
.mini-brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand-i.has-logo{background:#fff;box-shadow:0 0 0 .5px var(--sep);width:auto;min-width:32px;max-width:72px;padding:2px 4px}
.brand-i.has-logo img{max-height:28px;max-width:64px;object-fit:contain;display:block}
@media (min-width:900px){.mini-brand{display:none}}
#brandName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:17px}

/* ---- sign-up, delete ---- */
.signup-link{margin-top:10px}
.signup-link .linkbtn{font-size:13px}
.danger-link{color:var(--danger)!important}
.btn.danger-btn{background:var(--danger);color:#fff;box-shadow:0 8px 20px rgba(229,53,43,.22)}
.lock .sub b{color:var(--text);font-weight:600}

/* ---- tab bar (phone) / sidebar (wide screens) ---- */
.tabs{display:none}
body.unlocked:not(.in-form) .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;padding:6px 8px calc(4px + env(safe-area-inset-bottom));background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--sep)}
body.cover .tabs{visibility:hidden}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;color:var(--sub);font-size:10.5px;font-weight:500;letter-spacing:0;transition:color .2s,transform .18s var(--ease)}
.tab:active{transform:scale(.92)}
.tab.on{color:var(--accent)}
.tab svg{display:block}
.ti{position:relative;display:block}
.tbadge{position:absolute;top:-3px;left:17px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--bg)}
.side-only{display:none!important}
body.unlocked:not(.in-form) #app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.unlocked:not(.in-form) #toast{bottom:calc(76px + env(safe-area-inset-bottom))}

/* wide screens: the tabs become a sidebar and stay put, content sits in a column beside it */
@media (min-width:900px){
  :root{--side:236px}
  body.unlocked .tabs,body.unlocked:not(.in-form) .tabs{display:flex;flex-direction:column;justify-content:flex-start;gap:2px;position:fixed;top:0;bottom:0;left:0;right:auto;width:var(--side);padding:calc(18px + env(safe-area-inset-top)) 12px 18px;background:var(--card);border-top:0;border-right:.5px solid var(--sep);-webkit-backdrop-filter:none;backdrop-filter:none}
  body.unlocked .side-only{display:flex!important}
  .brand{align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;padding:6px 10px 18px}
  .brand-i{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#4f9bff,#0a46be)}
  .tab{flex:none;max-width:none;flex-direction:row;gap:12px;padding:10px 12px;border-radius:10px;font-size:15px;color:var(--text)}
  .tab svg{width:22px;height:22px;color:var(--sub)}
  .tab.on{background:var(--accent-soft);color:var(--accent)}
  .tab.on svg{color:var(--accent)}
  .tab:active{transform:none}
  .tbadge{position:static;display:inline-block;margin-left:auto;box-shadow:none;order:2}
  .tab .ti{display:contents}
  .lockbtn{margin-top:auto;color:var(--sub)}
  body.in-form .tabs .tab{opacity:.45;pointer-events:none}
  body.unlocked #app,body.unlocked .layer-in{margin-left:max(var(--side),calc(var(--side) + (100% - var(--side) - 680px) / 2));margin-right:0}
  body.unlocked #app{padding-bottom:48px}
  body.unlocked #toast,body.unlocked:not(.in-form) #toast{left:calc(50% + var(--side) / 2);bottom:28px}
  .tiles.two{grid-template-columns:repeat(4,1fr)}
}
@media (hover:hover) and (pointer:fine){
  button.row:hover,.qa a:hover,.chip:not(.on):hover{background-color:var(--press)}
  button.tile:hover{box-shadow:var(--shadow),0 0 0 1.5px var(--accent-soft)}
  .tab:not(.on):hover{background:var(--fill)}
  .nav-btn:hover{opacity:.7}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

  <button class="tab" data-tab="due"><span class="ti"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4" stroke-linejoin="round"/></svg><b class="tbadge" hidden></b></span><span>Due dates</span></button>
