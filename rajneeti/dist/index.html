<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff9a3c">
<meta name="description" content="Rajneeti: an offline Indian political strategy game. Win the Lok Sabha and govern as Prime Minister.">
<title>Rajneeti: Path to Power</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --ink: #1d2142;
  --muted: #6b7194;
  --card: #ffffff;
  --green: #22c55e; --green-d: #15803d;
  --blue: #3b82f6; --blue-d: #1d4ed8;
  --orange: #f59e0b; --orange-d: #b45309;
  --red: #ef4444; --red-d: #b91c1c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #2a1650; font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
body { display: flex; justify-content: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#app { position: relative; width: 100%; max-width: 480px; height: 100dvh; overflow: hidden;
  background: linear-gradient(170deg, #ff9a3c 0%, #ff5f8a 45%, #7b4dff 100%); }
#app::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .12;
  background: radial-gradient(circle at 20% 15%, #fff 0 2px, transparent 3px) 0 0 / 46px 46px, radial-gradient(circle at 70% 60%, #fff 0 1.5px, transparent 2.5px) 0 0 / 38px 38px; }
button { font: inherit; color: inherit; cursor: pointer; border: none; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.6); }
input { user-select: text; -webkit-user-select: text; font: inherit; }
h1, h2 { margin: .15em 0; line-height: 1.15; }
p { margin: .3em 0; }
.white { color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.small { font-size: 14px; }
.tiny { font-size: 12px; color: rgba(255, 255, 255, .85); text-align: center; }
.center { text-align: center; }
.spacer { flex: 1; }

.screen { position: relative; height: 100%; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom)); }

/* chunky game buttons */
.gbtn { display: block; width: 100%; padding: 14px 16px; border-radius: 18px; font-size: 17px; font-weight: 900; color: #fff; letter-spacing: .02em; background: var(--blue); box-shadow: 0 6px 0 var(--blue-d); margin-bottom: 6px; transition: transform .08s, box-shadow .08s; text-shadow: 0 1px 0 rgba(0, 0, 0, .2); }
.gbtn:not(:disabled):active { transform: translateY(5px); box-shadow: 0 1px 0 var(--blue-d); }
.gbtn small { font-size: 13px; opacity: .9; }
.gbtn.green { background: var(--green); box-shadow: 0 6px 0 var(--green-d); }
.gbtn.green:not(:disabled):active { box-shadow: 0 1px 0 var(--green-d); }
.gbtn.orange { background: var(--orange); box-shadow: 0 6px 0 var(--orange-d); }
.gbtn.orange:not(:disabled):active { box-shadow: 0 1px 0 var(--orange-d); }
.gbtn.red { background: var(--red); box-shadow: 0 6px 0 var(--red-d); }
.gbtn.red:not(:disabled):active { box-shadow: 0 1px 0 var(--red-d); }
.gbtn.ghost { background: rgba(255, 255, 255, .2); box-shadow: none; }
.gbtn.big { font-size: 21px; padding: 17px; border-radius: 22px; }
.gbtn.small { width: auto; padding: 8px 12px; font-size: 14px; border-radius: 12px; margin: 0; }

/* title */
.title { align-items: center; text-align: center; padding-top: calc(40px + env(safe-area-inset-top)); }
.logo-art { font-size: 96px; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 10px 0 rgba(0, 0, 0, .15)); }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
.logo { font-size: 56px; font-weight: 900; color: #fff; letter-spacing: .06em; margin: 0; text-shadow: 0 5px 0 #c2410c, 0 10px 18px rgba(0, 0, 0, .25); }
.sub { color: #fff; font-size: 20px; font-weight: 800; margin-top: 6px; }
.bigin { width: 100%; margin: 14px 0; padding: 16px; border-radius: 18px; border: 4px solid #fff; background: rgba(255, 255, 255, .95); font-size: 22px; font-weight: 800; text-align: center; color: var(--ink); outline: none; }
.symbols { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
.symb { width: 72px; height: 72px; border-radius: 22px; font-size: 38px; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); border: 4px solid transparent; }
.symb.on { border-color: #fff; transform: scale(1.1); }

/* top bar */
.top { display: flex; gap: 8px; align-items: center; padding: 10px 0 8px; }
.chip { background: rgba(0, 0, 0, .22); color: #fff; font-weight: 900; padding: 8px 14px; border-radius: 999px; font-size: 15px; white-space: nowrap; }
.menu { margin-left: auto; width: 44px; height: 44px; border-radius: 14px; background: rgba(0, 0, 0, .22); color: #fff; font-size: 20px; font-weight: 900; flex: none; }

/* tug of war seat bar */
.tug { background: rgba(255, 255, 255, .95); border-radius: 22px; padding: 10px 14px 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, .15); }
.tugtop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.who { display: flex; align-items: center; gap: 8px; }
.who b { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
.av { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-style: normal; font-size: 20px; }
.need { font-size: 12px; font-weight: 800; color: var(--muted); text-align: center; }
.tugbar { position: relative; height: 18px; border-radius: 9px; background: #e7e8f2; overflow: visible; }
.tugbar i { position: absolute; top: 0; bottom: 0; transition: width .5s cubic-bezier(.2, .9, .3, 1.2); }
.tugbar .me { left: 0; border-radius: 9px 0 0 9px; }
.tugbar .them { right: 0; border-radius: 0 9px 9px 0; }
.crown { position: absolute; left: calc(272 / 543 * 100%); top: -16px; transform: translateX(-50%); font-size: 18px; }
.crown::after { content: ""; position: absolute; left: 50%; top: 18px; width: 3px; height: 20px; background: var(--ink); transform: translateX(-50%); border-radius: 2px; }

/* stage */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 10px 0 0; }
.prompt { color: #fff; font-weight: 900; font-size: 20px; text-align: center; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.dots { letter-spacing: 2px; margin-left: 6px; }
.mcards { display: flex; flex-direction: column; gap: 12px; }
.mcard { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 22px; padding: 14px; text-align: left; box-shadow: 0 7px 0 rgba(0, 0, 0, .18); animation: deal .35s cubic-bezier(.2, .9, .3, 1.3) both; transition: transform .08s, box-shadow .08s; }
.mcard:not(:disabled):active { transform: translateY(5px) scale(.98); box-shadow: 0 2px 0 rgba(0, 0, 0, .18); }
@keyframes deal { from { opacity: 0; transform: translateY(30px) scale(.9); } }
.mi { font-size: 40px; width: 56px; height: 56px; display: grid; place-items: center; background: #f3f0ff; border-radius: 16px; flex: none; }
.mt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mt b { font-size: 17px; font-weight: 900; }
.mt small { color: var(--muted); font-weight: 700; }
.badge { background: #fff4d6; color: #9a5b00; font-weight: 900; border-radius: 12px; padding: 6px 10px; font-size: 15px; flex: none; }
.fans { display: flex; gap: 10px; font-size: 18px; flex-wrap: wrap; justify-content: inherit; }
.like, .dislike { background: #f1fbf4; border-radius: 10px; padding: 2px 8px; }
.dislike { background: #fff1f1; }

/* big card */
.bigcard { position: relative; background: var(--card); border-radius: 28px; padding: 22px 18px; text-align: center; box-shadow: 0 8px 0 rgba(0, 0, 0, .18); animation: pop .35s cubic-bezier(.2, .9, .3, 1.3); max-height: 100%; overflow-y: auto; }
.bigcard p { color: var(--muted); font-weight: 600; font-size: 15px; }
.bigcard h2 { font-weight: 900; font-size: 23px; }
.bigcard .fans { justify-content: center; margin-top: 10px; }
.bigcard.news { border: 4px solid #ffd166; }
.bigcard.swipe { touch-action: none; cursor: grab; }
@keyframes pop { from { opacity: 0; transform: scale(.85) rotate(-2deg); } }
.emo { font-size: 76px; line-height: 1.1; }
.promised { display: inline-block; background: #fff4d6; color: #9a5b00; border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: 14px; margin-top: 6px; }
.warnline { color: var(--red-d); font-weight: 800; font-size: 14px; margin-top: 8px; }
.costtag { position: absolute; top: 14px; right: 14px; background: #fff4d6; color: #9a5b00; font-weight: 900; padding: 5px 10px; border-radius: 12px; }
.costtag.poor { background: #fee2e2; color: var(--red-d); }
.stamp { position: absolute; top: 18px; padding: 4px 12px; border: 4px solid; border-radius: 10px; font-weight: 900; font-size: 26px; opacity: 0; pointer-events: none; }
.stamp.yes { left: 16px; color: var(--green); transform: rotate(-14deg); }
.stamp.no { right: 16px; color: var(--red); transform: rotate(14deg); }
.answers { display: flex; flex-direction: column; gap: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.yesno { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px; }
.round { width: 78px; height: 78px; border-radius: 50%; font-size: 34px; font-weight: 900; color: #fff; }
.round.red { background: var(--red); box-shadow: 0 6px 0 var(--red-d); }
.round.green { background: var(--green); box-shadow: 0 6px 0 var(--green-d); }
.round:not(:disabled):active { transform: translateY(5px); box-shadow: none; }
.bottom { padding-top: 10px; }

/* meters (PM) */
.meters { display: flex; justify-content: space-around; background: rgba(0, 0, 0, .18); border-radius: 22px; padding: 10px; cursor: pointer; }
.mfill { position: relative; width: 56px; height: 56px; border-radius: 18px; background: rgba(255, 255, 255, .25); overflow: hidden; display: grid; place-items: center; }
.mfill i { position: absolute; left: 0; right: 0; bottom: 0; transition: height .6s cubic-bezier(.2, .9, .3, 1.2); }
.mfill span { position: relative; font-size: 28px; }

/* results */
.bignums { display: flex; align-items: center; justify-content: space-around; }
.bignums b { display: block; font-size: 52px; font-weight: 900; line-height: 1; text-shadow: 0 4px 0 rgba(0, 0, 0, .12); background: #fff; border-radius: 24px; padding: 10px 14px; font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
.bignums small { display: block; text-align: center; color: #fff; font-weight: 900; margin-top: 6px; }
.vsx { color: #fff; font-weight: 900; font-size: 22px; }
.verdict { text-align: center; color: #fff; font-size: 34px; font-weight: 900; text-shadow: 0 4px 0 rgba(0, 0, 0, .2); animation: pop .5s cubic-bezier(.2, .9, .3, 1.5); }
.score { font-size: 30px; font-weight: 900; color: #9a5b00; }

/* modal */
.modal-bg { position: absolute; inset: 0; z-index: 50; background: rgba(20, 10, 40, .6); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .2s; }
.modal { background: #fff; border-radius: 28px; padding: 22px 18px; width: 100%; max-height: 90%; overflow-y: auto; box-shadow: 0 10px 0 rgba(0, 0, 0, .2); animation: pop .3s cubic-bezier(.2, .9, .3, 1.3); }
.modal h2 { text-align: center; font-weight: 900; }
@keyframes fade { from { opacity: 0; } }
.howto { display: flex; flex-direction: column; gap: 12px; margin: 12px 0 18px; }
.howto > div { display: flex; gap: 14px; align-items: center; font-weight: 700; font-size: 16px; }
.howto span { font-size: 34px; }
.howto p { margin: 0; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 2px solid #f1f1f7; font-weight: 700; }
.faces { display: flex; justify-content: space-around; text-align: center; font-weight: 800; font-size: 14px; margin: 12px 0; }
.faces span { font-size: 13px; }

.toast { position: absolute; left: 50%; top: 23%; transform: translate(-50%, 10px) scale(.95); background: #fff; color: var(--ink); padding: 12px 18px; border-radius: 18px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; width: max-content; max-width: 86%; text-align: center; font-size: 15px; font-weight: 800; box-shadow: 0 6px 0 rgba(0, 0, 0, .2); }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast.bad { box-shadow: 0 6px 0 var(--red); }
.toast.good { box-shadow: 0 6px 0 var(--green); }

@media (max-height: 680px) { .emo { font-size: 56px; } .mi { font-size: 30px; width: 46px; height: 46px; } .mcard { padding: 10px; } .bignums b { font-size: 54px; min-width: 100px; } }
.meter { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.meter small { color: #fff; font-weight: 900; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
// RAJNEETI — static game data. All parties and people are fictional.

const BLOCS = [
  { id: 'farmers',  name: 'Farmers',      icon: '🌾', nat: 0.24 },
  { id: 'poor',     name: 'Poor families',   icon: '🛖', nat: 0.22 },
  { id: 'workers',  name: 'Workers',      icon: '🏭', nat: 0.14 },
  { id: 'middle',   name: 'City families', icon: '🏠', nat: 0.18 },
  { id: 'youth',    name: 'Young people',        icon: '🎓', nat: 0.14 },
  { id: 'business', name: 'Business people',     icon: '💼', nat: 0.08 },
];

// base: starting strength [you, RSP, NBM, regional]. pos: [col,row] on tile map.
// reg: regional party (null = scattered independents, cannot ally).
// lean: regional party's starting affinity toward you (0..1). dislikes: reform tags it opposes.
const STATES = [
  { id: 'JK', name: 'Jammu & Kashmir',  seats: 6,  urban: .27, pos: [2, 0], base: [24, 34, 4, 38], reg: { name: 'Kashmir National Front', short: 'KNF', lean: .6, dislikes: ['centralise'] } },
  { id: 'PB', name: 'Punjab',           seats: 13, urban: .37, pos: [1, 1], base: [34, 16, 22, 28], reg: { name: 'Panth Kisan Dal', short: 'PKD', lean: .45, dislikes: ['farm', 'land'] } },
  { id: 'HP', name: 'Himachal Pradesh', seats: 4,  urban: .10, pos: [2, 1], base: [44, 48, 4, 4], reg: null },
  { id: 'UK', name: 'Uttarakhand',      seats: 5,  urban: .30, pos: [3, 1], base: [38, 52, 4, 6], reg: null },
  { id: 'RJ', name: 'Rajasthan',        seats: 25, urban: .25, pos: [0, 2], base: [40, 46, 4, 10], reg: null },
  { id: 'HR', name: 'Haryana',          seats: 10, urban: .35, pos: [1, 2], base: [36, 42, 6, 16], reg: { name: 'Haryana Lok Dal', short: 'HLD', lean: .4, dislikes: ['farm', 'land'] } },
  { id: 'DL', name: 'Delhi',            seats: 7,  urban: .98, pos: [2, 2], base: [22, 44, 32, 2], reg: null },
  { id: 'UP', name: 'Uttar Pradesh',    seats: 80, urban: .23, pos: [3, 2], base: [24, 38, 6, 30], reg: { name: 'Awadh Lok Manch', short: 'ALM', lean: .55, dislikes: ['labour', 'anticorruption'] } },
  { id: 'BR', name: 'Bihar',            seats: 40, urban: .12, pos: [4, 2], base: [20, 32, 6, 42], reg: { name: 'Magadh Janata Dal', short: 'MJD', lean: .35, dislikes: ['anticorruption', 'centralise'] } },
  { id: 'AS', name: 'Assam',            seats: 14, urban: .14, pos: [6, 2], base: [30, 42, 4, 24], reg: { name: 'Asom Jatiya Parishad', short: 'AJP', lean: .4, dislikes: ['centralise'] } },
  { id: 'NE', name: 'North-East (6 states)', seats: 11, urban: .25, pos: [7, 2], base: [26, 36, 4, 34], reg: { name: "North-East People's Alliance", short: 'NEPA', lean: .45, dislikes: ['land', 'centralise'] } },
  { id: 'GJ', name: 'Gujarat',          seats: 26, urban: .43, pos: [0, 3], base: [30, 58, 4, 8], reg: null },
  { id: 'MP', name: 'Madhya Pradesh',   seats: 29, urban: .28, pos: [1, 3], base: [38, 48, 4, 10], reg: null },
  { id: 'CG', name: 'Chhattisgarh',     seats: 11, urban: .23, pos: [2, 3], base: [40, 46, 4, 10], reg: null },
  { id: 'JH', name: 'Jharkhand',        seats: 14, urban: .24, pos: [3, 3], base: [24, 36, 4, 36], reg: { name: 'Jharkhand Adivasi Morcha', short: 'JAM', lean: .6, dislikes: ['land', 'market'] } },
  { id: 'WB', name: 'West Bengal',      seats: 42, urban: .32, pos: [4, 3], base: [12, 30, 8, 50], reg: { name: 'Bangla Matri Sangha', short: 'BMS', lean: .5, dislikes: ['labour', 'market', 'centralise'] } },
  { id: 'MH', name: 'Maharashtra',      seats: 48, urban: .45, pos: [0, 4], base: [28, 36, 8, 28], reg: { name: 'Maratha Swabhiman Sena', short: 'MSS', lean: .4, dislikes: ['farm'] } },
  { id: 'TG', name: 'Telangana',        seats: 17, urban: .39, pos: [1, 4], base: [32, 24, 4, 40], reg: { name: 'Telangana Praja Samithi', short: 'TPS', lean: .45, dislikes: ['centralise'] } },
  { id: 'OD', name: 'Odisha',           seats: 21, urban: .17, pos: [2, 4], base: [18, 32, 4, 46], reg: { name: 'Utkal Jana Dal', short: 'UJD', lean: .4, dislikes: ['land'] } },
  { id: 'GA', name: 'Goa',              seats: 2,  urban: .62, pos: [0, 5], base: [36, 46, 10, 8], reg: null },
  { id: 'KA', name: 'Karnataka',        seats: 28, urban: .39, pos: [1, 5], base: [38, 40, 4, 18], reg: { name: 'Kannada Raitha Paksha', short: 'KRP', lean: .45, dislikes: ['farm'] } },
  { id: 'AP', name: 'Andhra Pradesh',   seats: 25, urban: .30, pos: [2, 5], base: [14, 14, 4, 68], reg: { name: 'Andhra Praja Vedika', short: 'APV', lean: .3, dislikes: ['fiscal'] } },
  { id: 'UT', name: 'Other UTs',        seats: 6,  urban: .60, pos: [4, 5], base: [36, 40, 6, 18], reg: null },
  { id: 'KL', name: 'Kerala',           seats: 20, urban: .48, pos: [1, 6], base: [40, 14, 6, 40], reg: { name: 'Kerala Left Front', short: 'KLF', lean: .35, dislikes: ['market', 'labour', 'land'] } },
  { id: 'TN', name: 'Tamil Nadu',       seats: 39, urban: .48, pos: [2, 6], base: [16, 12, 4, 68], reg: { name: 'Tamizh Makkal Kazhagam', short: 'TMK', lean: .7, dislikes: ['centralise'] } },
];

const RIVALS = {
  A: { name: 'Rashtriya Samruddhi Party', short: 'RSP', color: '#d64541', leader: 'PM Devendra Rathore' },
  B: { name: 'Naya Bharat Morcha',        short: 'NBM', color: '#3b82f6', leader: 'Kavya Iyer' },
};

const PARTY_COLORS = ['#10b981', '#8b5cf6', '#f59e0b', '#06b6d4', '#ec4899'];
const PARTY_SYMBOLS = ['🦚', '☀️', '🌳', '🪔', '🦁', '⭐'];

const IDEOLOGIES = {
  welfare:  { name: 'Social Welfare', desc: 'Champion of farmers, the poor and workers.', appeal: { farmers: 8, poor: 10, workers: 8, middle: -2, youth: 0, business: -8 } },
  centrist: { name: 'Big-Tent Centrist', desc: 'A little something for everyone.', appeal: { farmers: 4, poor: 4, workers: 3, middle: 3, youth: 3, business: 0 } },
  reform:   { name: 'Pro-Growth Reformer', desc: 'Jobs, markets and aspiration.', appeal: { farmers: -2, poor: 0, workers: 0, middle: 8, youth: 8, business: 10 } },
};

const RIVAL_APPEAL = {
  A: { farmers: -2, poor: 3, workers: -2, middle: 8, youth: 2, business: 10 },
  B: { farmers: 0, poor: 2, workers: 2, middle: 5, youth: 9, business: 0 },
};

const DIFFICULTY = {
  easy:   { name: 'Easy',   baseBonus: 4,  funds: 300, rivalAI: 0.7 },
  normal: { name: 'Normal', baseBonus: 0,  funds: 220, rivalAI: 1.0 },
  hard:   { name: 'Hard',   baseBonus: -3, funds: 160, rivalAI: 1.3 },
};

// Manifesto promises. check(G) decides at the end of a term whether the promise was kept.
const PROMISES = [
  { id: 'loanwaiver', name: 'Forgive farmer loans', blocs: { farmers: 9, poor: 2, business: -3 }, keep: 'Pass the Farm Loan Waiver.', check: G => G.gov.passed.includes('loanwaiver') },
  { id: 'msp',        name: 'Fair crop prices', blocs: { farmers: 10, business: -3, middle: -1 }, keep: 'Pass the MSP Guarantee Act.', check: G => G.gov.passed.includes('msp') },
  { id: 'taxcut',     name: 'Lower taxes', blocs: { middle: 9, youth: 2 }, keep: 'Top income-tax rate at 27% or lower.', check: G => G.eco.b.itr <= 27 },
  { id: 'jobs',       name: 'Lots of new jobs', blocs: { youth: 9, workers: 4 }, keep: 'Unemployment below 6% at term end.', check: G => G.eco.unemp < 6 },
  { id: 'ops',        name: 'Big pensions', blocs: { middle: 5, workers: 4, business: -2 }, keep: 'Restore the Old Pension Scheme.', check: G => G.gov.passed.includes('ops') },
  { id: 'cash',       name: 'Money for mothers', blocs: { poor: 10, middle: 1 }, keep: 'Pass the Mahila Samman cash transfer.', check: G => G.gov.passed.includes('cash') },

    text: () => 'The other party says your relative got special deals.',
    choices: () => [

    ] },
  { id: 'harvest', icon: '🌽', title: 'Super Harvest!', weight: .8,

    choices: () => [
      { label: '🛒 Government buys the extra', run: () => { oneTime(.1); mod('farmers', 5); G.eco.food -= .4; return 'Farmers got good money! 🌾'; } },
      { label: '🚢 Sell to other countries', run: () => { mod('farmers', 3); mod('business', 1); return 'India sends food to the world!'; } },
    ] },
  { id: 'stateelection', icon: '🗳️', title: 'Small Elections in States', scheduled: true,
    text: (G, c) => `${c.states.map(id => stateById(id).name).join(', ')} are choosing their state leaders.`,
    choices: (G, c) => [
      { label: '💪 Work very hard', pc: 3, run: () => stateElections(c.states, .12) },
      { label: '🙂 Work a little', pc: 1, run: () => stateElections(c.states, .03) },
      { label: '🏛️ Stay in Delhi', run: () => stateElections(c.states, -.08) },
    ] },
  { id: 'allythreat', icon: '⚠️', title: 'A Friend Wants to Leave!', scheduled: true,
    text: (G, c) => { const a = G.gov.allies.find(x => x.key === c.key); return a ? `Your friend ${a.short} (${a.seats} seats) is unhappy and may leave you!` : 'A friend is unhappy.'; },
    choices: (G, c) => [
      { label: '🎁 Give money for their state', pc: 1, run: () => { oneTime(.15); allySat(30, c.key); return 'Your friend is happy again! 🤝'; } },
      { label: '🏛️ Make their leader a minister', pc: 2, run: () => { allySat(25, c.key); tr(-1); return 'They have a minister now. Happy!'; } },

    ] },
  { id: 'noconfidence', icon: '⚔️', title: 'Big Vote: Should You Stay?', scheduled: true,
    text: () => `The other parties want to remove you. You have ${govSeats()} seats. You need ${MAJORITY}.`,
    choices: () => [
      { label: '🤝 Ask small parties for help', pc: 4, run: () => confidenceVote(.25) },
      { label: '🤞 Hope for the best', run: () => confidenceVote(0) },
      { label: '🗳️ Ask people to vote again', run: () => { governmentFalls('You asked for a new election.'); return 'New election coming!'; } },
    ] },
];

function stateElections(ids, bonus) {
  const won = [], lost = [];
  for (const id of ids) {
    const a = stateApproval(id);
    const allied = G.gov.allies.some(x => x.key === id);
    const p = clamp(.3 + (a - 45) / 40 + bonus + (allied ? .1 : 0), .05, .95);
    if (rand() < p) won.push(id); else lost.push(id);
  }
  G.gov.rs = clamp(G.gov.rs + won.length * 3 - lost.length * 3, 40, 200);
  G.gov.stateElectionsWon += won.length; G.gov.stateElectionsLost += lost.length;
  if (won.length > lost.length) modAll(1); else if (lost.length > won.length) modAll(-1);
  return `You won ${won.length}, lost ${lost.length}. ${won.length >= lost.length ? '🎉' : '😕'}`;
}

function allyBluff(key) {
  const a = G.gov.allies.find(x => x.key === key);
  if (!a) return 'They already left.';
  if (rand() < .5) { a.sat = clamp(a.sat + 5, 0, 100); return `${a.short} stays with you! 🤝`; }
  G.gov.allies = G.gov.allies.filter(x => x !== a);
  if (govSeats() < MAJORITY) G.gov.pendingRisk = 'noconfidence';
  return `${a.short} left you. 💔 You lost ${a.seats} seats.`;
}

function confidenceVote(bonus) {
  const seats = govSeats();
  const p = clamp(.3 + bonus + (overallApproval() - 45) / 80 + (seats - 250) / 80, .05, .95);
  if (rand() < p) { G.gov.minority = true; tr(2); return 'You won the vote! You stay PM! 🎉'; }
  governmentFalls('You lost the vote.');
  return 'You lost the vote. New election! 🗳️';
}
